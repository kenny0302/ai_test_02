global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-platform-demo'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Service metrics
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # RabbitMQ Prometheus plugin metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # MinIO metrics (S3 storage)
  # Note: MinIO metrics require authentication, which is complex to configure in Prometheus
  # For now, MinIO metrics can be viewed through the MinIO console at http://localhost:9001
  # - job_name: 'minio'
  #   static_configs:
  #     - targets: ['minio:9000']
  #   metrics_path: '/minio/v2/metrics/cluster'
  #   bearer_token: 'minio-bearer-token'  # Requires MinIO auth setup
  #   scrape_interval: 15s

  # PostgreSQL exporter (if enabled)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis exporter (if enabled)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
